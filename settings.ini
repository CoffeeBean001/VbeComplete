; VbeComplete 配置
; 删掉行首的 `;` 并改数值，重启程序生效。
; 优先级：环境变量 VBECOMPLETE_<键名> > settings.ini > 程序默认值。
; 全部注释掉 = 全部默认值。这里只有换路径 / 性能几项，补全行为与外观已固定。

[settings]

; ==== 片段库 ====
; SNIPPET_DB =            片段库路径，留空 = 程序目录下 snippets-cs.db

; ==== 缩进 ====
; TAB_WIDTH = 4           VBE 里一个 Tab 等于几个显示列

; ==== 性能 ====
; SCOPE_TTL = 2.0         全工程作用域缓存刷新间隔（秒）
; SCOPE_TTL_TYPING = 8.0  打字中允许沿用旧作用域多久（秒）
; FORM_CTL_TTL = 5.0      窗体控件名重读间隔（秒），读 Designer 每次约 23ms
; SNAP_MAX_AGE = 1.0      快照最长复用多久（秒）

; ==== 开机自启 ====
; AUTO_START = 1          只在还没有 autostart.txt 时作为初值，真正开关在托盘菜单
